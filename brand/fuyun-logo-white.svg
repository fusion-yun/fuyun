<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 170 980 330" width="980" height="330" role="img" aria-label="FuYun — integrated modelling and knowledge computing">
  <!-- FuYun logo for dark backgrounds (e.g. site footers): as fuyun-logo.svg (viewBox cropped to the wordmark for inline use), with the navy
       glyphs, rule and tagline in white / light grey and no card border. -->
  <svg x="40" y="40" width="1200" height="560" viewBox="0 0 240 100" preserveAspectRatio="xMidYMid meet">
    <text x="50%" y="43%" font-family="Arial, sans-serif" font-size="54" font-weight="bold" dominant-baseline="middle" text-anchor="middle">
      <tspan fill="#FF8C00" font-style="italic">F</tspan><tspan fill="#FFFFFF">u</tspan><tspan fill="#FF8C00" font-style="italic">Y</tspan><tspan fill="#FFFFFF">un</tspan>
    </text>
    <line x1="40" y1="64" x2="200" y2="64" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.25" />
    <text x="50%" y="81%" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" fill="#C9D3E0" dominant-baseline="middle" text-anchor="middle" font-weight="500" textLength="190" lengthAdjust="spacing">INTEGRATED MODELLING · KNOWLEDGE COMPUTING</text>
  </svg>
</svg>
